<!doctype html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="shortcut icon" type="image/png" href="../src/album_se_logo.png">
    <link href="../_ext/cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(220, 236, 255, 0.50) 100%),
                url('../../src/index2.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.24);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 24px;
            border: 1.2px solid rgba(255, 255, 255, 0.35);
            padding: 40px 32px 32px 32px;
            max-width: 380px;
            width: 100%;
            margin: 48px auto;
            position: relative;
            z-index: 2;
        }

        .login-logo {
            display: block;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.09);
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.45);
            padding: 6px;
        }

        .glass-container h2 {
            text-align: center;
            color: #333;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 18px;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.15);
        }

        .form-label {
            color: #23272f;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #dfe0e3;
            border-radius: 10px;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }

        .form-control:focus {
            box-shadow: 0 0 0 2px #b5d1ff;
            background: rgba(255, 255, 255, 0.93);
        }

        .glass-btn,
        .btn-primary {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            border-radius: 14px;
            color: #222;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(80, 80, 80, 0.10);
            transition: background 0.2s, box-shadow 0.2s;
            padding: 10px 0;
            letter-spacing: 0.4px;
        }

        .btn-primary {
            background: rgb(55 73 111 / 90%);
            color: #fff !important;
        }
        .btn-primary:hover {
            background: rgb(55 73 111 / 90%);
            color: #fff !important;
        }



        .gsi-material-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            border-radius: 14px;
            color: #222;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(80, 80, 80, 0.10);
            height: 48px;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s, box-shadow 0.2s;
            padding: 0 0;
            outline: none;
            border: 1px solid rgba(200, 200, 200, 0.35);
        }

        .gsi-material-button:hover,
        .gsi-material-button:focus {
            background: rgba(255, 255, 255, 0.36);
            box-shadow: 0 4px 16px rgba(80, 80, 80, 0.17);
        }

        .gsi-material-button .gsi-material-button-icon {
            width: 24px;
            height: 24px;
            min-width: 24px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gsi-material-button .gsi-material-button-contents {
            flex: 1;
            font-weight: 600;
            color: #222 !important;
            text-align: center;
            font-size: 15px;
        }

        .forgot-password {
            color: #ECB176;
            display: inline-block;
            margin-top: 3px;
        }

        .forgot-password:hover {
            color: #b28029;
        }

        .glass-container a {
            color: #4866c6;
            text-decoration: none;
        }

        .glass-container a:hover {
            color: #273c75;
            text-decoration: underline;
        }

        .alert-danger {
            border-radius: 8px;
            background: rgba(255, 0, 0, 0.07);
            border: 1px solid rgba(255, 0, 0, 0.13);
        }

        .error-message {
            color: #d8000c;
        }

        @media (max-width: 600px) {
            .glass-container {
                padding: 22px 8px 16px 8px;
            }

            .login-logo {
                width: 54px;
                height: 54px;
            }

            .gsi-material-button .gsi-material-button-contents {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>
    <div class="glass-container">
        <img src="../src/album_se_logo.png" alt="Logo" class="login-logo">
        <h2>Đăng nhập</h2>
                <form action="process.php" method="POST" autocomplete="off">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" class="form-control" id="email" name="email" placeholder="Nhập Email..." required="">

                <label for="password" class="form-label">Mật khẩu</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Nhập Mật Khẩu..." required="">
            </div>
            <button type="submit" class="btn btn-primary w-100 glass-btn">Đăng nhập</button>
        </form>
        <button class="gsi-material-button" type="button" onclick="window.location.href='https://accounts.google.com/o/oauth2/v2/auth?response_type=code&amp;access_type=online&amp;client_id=567861779816-q31mnoa8nkd3o6gr2be6hgdned317shv.apps.googleusercontent.com&amp;redirect_uri=https%3A%2F%2Falbumse.online%2Flogin%2Findex.php&amp;state&amp;scope=email%20profile&amp;approval_prompt=auto'">

                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>

            <span class="gsi-material-button-contents">Đăng nhập với Google</span>

        <div class="mt-3">
            <a href="../forgot_password/index.html" class="forgot-password">Quên mật khẩu?</a>
        </div>
        <div class="mt-3" style="text-align:center;">
            Chưa có tài khoản? <a href="../register/index.html">Đăng ký ngay</a>
        </div>
    </div>

    <script src="../_ext/cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>


</body></html>
