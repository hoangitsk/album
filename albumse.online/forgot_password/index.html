<!doctype html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yêu cầu đặt lại mật khẩu</title>
    <link rel="shortcut icon" type="image/png" href="../src/album_se_logo.png">
    <link href="../_ext/cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, 0.58) 0%, rgba(220, 236, 255, 0.50) 100%),
                url('../../src/index2.jpg') center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.24);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 24px;
            border: 1.2px solid rgba(255, 255, 255, 0.35);
            padding: 40px 32px 32px 32px;
            max-width: 380px;
            width: 100%;
            margin: 48px auto;
            position: relative;
            z-index: 2;
        }
        .login-logo {
            display: block;
            margin: 0 auto 18px auto;
            border-radius: 50%;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.09);
            width: 78px;
            height: 78px;
            background: rgba(255, 255, 255, 0.45);
            padding: 6px;
        }
        .glass-container h2 {
            text-align: center;
            color: #333;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 18px;
            text-shadow: 0 1px 8px rgba(255, 255, 255, 0.15);
        }
        .form-label {
            color: #23272f;
            font-weight: 500;
        }
        .form-control {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #dfe0e3;
            border-radius: 10px;
            box-shadow: none;
            transition: box-shadow 0.2s;
        }
        .form-control:focus {
            box-shadow: 0 0 0 2px #b5d1ff;
            background: rgba(255, 255, 255, 0.93);
        }
        .glass-btn,
        .btn-primary {
            background: rgba(255, 255, 255, 0.22);
            border: 1px solid rgba(255, 255, 255, 0.38);
            backdrop-filter: blur(12px) saturate(140%);
            -webkit-backdrop-filter: blur(12px) saturate(140%);
            border-radius: 14px;
            color: #222;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(80, 80, 80, 0.10);
            transition: background 0.2s, box-shadow 0.2s;
            padding: 10px 0;
            letter-spacing: 0.4px;
        }
        .btn-primary {
            background: rgb(55 73 111 / 90%);
            color: #fff !important;
            border-color: #6F4E37;
        }
        .btn-primary:hover,
        .btn-primary:focus {
            background: rgb(55 73 111 / 90%);
            color: #000 !important;
            border-color: #A67B5B;
        }
        .glass-btn:hover,
        .glass-btn:focus {
            background: rgba(255, 255, 255, 0.36);
            box-shadow: 0 4px 16px rgba(80, 80, 80, 0.17);
        }
        .forgot-password {
            color: #ECB176;
            display: inline-block;
            margin-top: 3px;
        }
        .forgot-password:hover {
            color: #b28029;
        }
        .glass-container a {
            color: #4866c6;
            text-decoration: none;
        }
        .glass-container a:hover {
            color: #273c75;
            text-decoration: underline;
        }
        .error-message {
            color: #d8000c;
        }
        .success-message {
            color: #25832e;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
        }
        @media (max-width: 600px) {
            .glass-container {
                padding: 22px 8px 16px 8px;
            }
            .login-logo {
                width: 54px;
                height: 54px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <img src="../src/album_se_logo.png" alt="Logo" class="login-logo">
        <h2 class="mt-3">Yêu cầu đặt lại mật khẩu</h2>
        
        
        <form action="request.php" method="POST" autocomplete="off">
            <div class="mb-3">
                <label for="email" class="form-label">Email:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Nhập Email..." required="">
            </div>
            <button type="submit" class="btn btn-primary w-100 glass-btn">Gửi yêu cầu</button>
        </form>
        <div class="mt-3" style="text-align:center;">
            <a href="../login/index.html" class="forgot-password">Trở lại đăng nhập</a>
        </div>
    </div>

    <script src="../_ext/cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body></html>
